name: quote-bot

# 텔레그램 종목조회 봇 (fisher_stock_bot)
# /quote 005930 · 삼성전자 · NVDA 처럼 보내면 데이터 카드를 회신.
# 크론이 주기적으로 getUpdates 로 밀린 명령을 처리한다(응답까지 최대 크론주기 지연).
on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (private repo면 Actions 무료 2000분 주의 — README 참고)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quote-bot
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run quote bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # fisher_stock_bot 토큰
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}               # 한글명·확정실적용(없어도 동작)
        run: python bot/quote_bot.py
      - name: Persist offset
        if: always()
        run: |
          git config user.name  "quote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot/quote_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: quote offset [skip ci]"
          git pull --rebase --autostash 2>/dev/null || true
          git push || true
